{% extends "base.html" %}

{% block title %}Главная - Мой Проект{% endblock %}

{% block content %}

<form action={{ url_for("api.upload") }} method="POST" enctype="multipart/form-data">
<p>Video name</p>
<input type="text" name="name" >
<p>Description</p>
<textarea name="description">
</textarea>
<p>Tags</p>
<input type="text" name="tags" >
<br><br>
<input type="file" name="file" >
<br><br>
<input type="submit" value="Upload">
</form>

{% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            {% endif %}
        {% endwith %}
{% endblock %}
